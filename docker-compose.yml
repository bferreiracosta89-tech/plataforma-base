# =============================================================================
# Rodar a imagem de produção na sua máquina (opcional).
#
# No dia a dia, use `npm run dev` — é mais rápido e recarrega sozinho.
# Isto aqui serve pra testar EXATAMENTE o que vai pro ar antes de publicar:
#
#   docker compose up --build
#   abra http://localhost:3000
#
# No EasyPanel você NÃO usa este arquivo — lá é só o Dockerfile.
# =============================================================================
services:
  app:
    build: .
    container_name: template-alunos
    # Dentro do container o site roda na porta 80 (igual em produção).
    # Aqui fora usamos a 3000 pra não brigar com nada da sua máquina.
    ports:
      - "3000:80"
    env_file:
      - .env.local
    restart: unless-stopped
    # Trancas de segurança: o container não pode ganhar privilégio novo, não
    # tem permissões especiais e não consegue escrever no próprio disco (só nas
    # duas pastas temporárias abaixo).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    # 1 GB é o mínimo confortável pra Next 16 com gráficos. Menos que isso, o
    # container morre sozinho sob tráfego (o famoso "exit 137").
    mem_limit: 1024m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
